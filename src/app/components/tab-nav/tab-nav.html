<nav class="tab-nav" aria-label="Profile sections">
  @for (tab of tabs; track tab.id) {
    <button
      type="button"
      class="tab-btn"
      [class.active]="activeTab === tab.id"
      (click)="select(tab.id)"
    >
      {{ tab.label }}
      @if (tab.count !== undefined) {
        <span class="tab-count">{{ tab.count }}</span>
      }
    </button>
  }
</nav>
