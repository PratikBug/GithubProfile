<section class="popular-repos">
  <div class="section-header">
    <h3>Popular repositories</h3>
    <a href="javascript:void(0)" class="customize-link">Customize your pins</a>
  </div>

  <div class="repo-grid">
    @for (repo of repos; track repo.name) {
      <article class="repo-card">
        <div class="repo-card__top">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" class="repo-icon">
            <path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"></path>
          </svg>
          <a href="javascript:void(0)" class="repo-name">{{ repo.name }}</a>
          <span class="visibility-badge">{{ repo.visibility }}</span>
        </div>

        @if (repo.forkedFrom) {
          <p class="forked-from">
            Forked from <a href="javascript:void(0)">{{ repo.forkedFrom }}</a>
          </p>
        }

        @if (repo.description) {
          <p class="repo-desc">{{ repo.description }}</p>
        }

        @if (repo.language) {
          <div class="repo-lang">
            <span class="lang-dot" [style.background]="repo.languageColor"></span>
            {{ repo.language }}
          </div>
        }
      </article>
    }
  </div>
</section>
