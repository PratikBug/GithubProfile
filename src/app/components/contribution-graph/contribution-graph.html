<section class="contribution-graph">
  <div class="graph-main">
    <div class="graph-header">
      <h3>{{ totalContributions }} contributions in {{ year }}</h3>
    </div>
    <div class="chart-wrapper">
      @if (loading) {
        <div class="chart-loading">Loading contribution graph…</div>
      }
      <div #chartEl class="chart" [class.hidden]="loading"></div>
    </div>
  </div>

  <div class="year-list">
    @for (y of years; track y) {
      <button type="button" class="year-btn" [class.active]="y === year" (click)="selectYear(y)">
        {{ y }}
      </button>
    }
  </div>
</section>
